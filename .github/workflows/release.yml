name: Release artifact

on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read

jobs:
  build:
    name: Verify and build release wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Verify release metadata and clean checkout
        run: uv run python scripts/check_release.py --require-tag --require-clean
      - name: Build wheel
        run: uv build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpwn-wheel
          path: dist/*.whl
