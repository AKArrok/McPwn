name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # Locks the lint baseline set by CODE_REVIEW. Without CI, the 43
        # ruff warnings previously catalogued silently regress on every PR.
        # This step is the regression net for them.
        run: ruff check mcp_redteam eval tests

      - name: Test (pytest)
        # B (test_scan_metadata, 4 cases) and C (test_regression_baseline,
        # 2 cases) ride alongside the existing 60-case suite, totalling 66
        # tests in 1.88s on a single core. The C cases are hermetic - no
        # DVMCP, no LLM API, no network - so the runner needs nothing more
        # than the editable install.
        run: pytest tests/ -v

      - name: Check docs facts vs code
        # Locks doc/code consistency: test counts, signal counts, strategy
        # card counts, package-data globs, cli command names. When adding a
        # machine-checkable claim to any doc, add a rule in
        # scripts/check_docs.py instead of hand-syncing the number.
        run: python scripts/check_docs.py

      - name: Fail loudly on any stale baseline drift
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::CI failed - see the 'Test (pytest)' step for the failing case. If the regression baseline (tests/baselines/m0_9001.json) is intentionally being updated, refresh it from a known-good scan and document the change in the commit message."
            exit 1
          fi