name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 是通用回归; windows 是主开发平台 (spawner 的 venv 路径与
        # subprocess 语义都以 Windows 为一等公民, 双平台同守)
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    env:
      # windows runner 默认 cp1252 控制台, 输出中文的子进程会 UnicodeEncodeError;
      # 强制 Python 全链路 UTF-8 (与主开发机一致)
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check mcp_redteam eval tests

      - name: Test (pytest)
        # 全套 hermetic 回归: 无 DVMCP、无 LLM API、无网络, 不需要任何 key
        run: pytest -q

      - name: Check docs facts vs code
        # 文档/代码一致性: 测试数、信号数、策略卡数、package-data glob、cli 命令名。
        # gitignore 的本地文档 (HANDOFF*/PROGRESS) 在 CI 中自动跳过并标注。
        run: python scripts/check_docs.py
