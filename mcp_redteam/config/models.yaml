# 模型注册表:key 是逻辑名,value 描述 OpenAI 兼容端点。API key 走环境变量。
attacker:
  provider: ark
  base_url: https://ark.cn-beijing.volces.com/api/v3
  # 可选:kimi-k2-250905 / kimi-k2-thinking-251104 也可
  model: glm-5-2-260617
  temperature: 0.7
  timeout: 60
  key_env: ARK_API_KEY

victim:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  temperature: 0.3
  timeout: 60
  key_env: DEEPSEEK_API_KEY

judge:
  provider: ark
  base_url: https://ark.cn-beijing.volces.com/api/v3
  # 暂用同 attacker 模型(账号只开通了 glm-5-2-260617);
  # 后续开通 lite 后切到 doubao-1-5-lite 或类似便宜模型即可。
  model: glm-5-2-260617
  temperature: 0.0
  timeout: 60
  key_env: ARK_API_KEY
