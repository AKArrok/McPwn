# 模型注册表:key 是逻辑名,value 描述 OpenAI 兼容端点。API key 走环境变量。
attacker:
  provider: ark
  base_url: https://ark.cn-beijing.volces.com/api/v3
  # 可选:kimi-k2-250905 / kimi-k2-thinking-251104 也可
  model: deepseek-v4-pro-260425  # 临时切: glm-5-2-260617 被 ARK paused (set inference limit)
  temperature: 0.7
  timeout: 60
  key_env: ARK_API_KEY

judge:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  # doubao-seed-2.0-lite 在 ARK 上 404，改用 deepseek-v4-flash 做 judge。
  model: deepseek-v4-flash
  temperature: 0.0
  timeout: 60
  key_env: DEEPSEEK_API_KEY
