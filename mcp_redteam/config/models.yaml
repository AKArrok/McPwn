# 模型注册表:key 是逻辑名,value 描述 OpenAI 兼容端点。API key 走环境变量。
# 可选字段: seed (int) - LLM 采样种子, 仅当端点支持 OpenAI `seed` 参数时设置;
# DeepSeek 不支持 seed, 留空即可 (Stage-3 "同 seed" 如实记录, 漂移看 attack_messages_sha1)。
attacker:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  temperature: 0.7
  timeout: 60
  key_env: DEEPSEEK_API_KEY

judge:
  provider: ark-plan
  base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  # Ark Plan 的豆包模型，需使用 Coding/Agent Plan API Key。
  model: doubao-seed-2.0-lite
  temperature: 0.0
  timeout: 60
  key_env: ARK_API_KEY
