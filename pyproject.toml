[project]
name = "mcpwn"
version = "0.1.0"
description = "MCP red-team agent: autonomous vulnerability discovery for MCP servers (agent-first; DVMCP as regression fixture)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.2",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml",
    "httpx",
    "jinja2",
    "rich",
    "python-dotenv",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "typer>=0.12",
    "langgraph>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
mcpwn = "mcp_redteam.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_redteam*", "eval*"]

[tool.setuptools.package-data]
"mcp_redteam" = [
    "config/*.yaml",
    "**/agents/*.md",
    "**/agents/**/*.md",
    "vulns/cards/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"mcp_redteam/agent/executor.py" = ["BLE001"]
"mcp_redteam/cli.py" = ["BLE001", "B008"]
"mcp_redteam/orchestrator/runner.py" = ["BLE001"]
"mcp_redteam/orchestrator/reset_hook.py" = ["PLW1510"]
"mcp_redteam/orchestrator/scan_meta.py" = ["BLE001"]
"mcp_redteam/targets/mcp_client.py" = ["PYI034"]
"mcp_redteam/models/chat.py" = ["TRY004"]
"eval/dvmcp/runner.py" = ["BLE001"]
